[tool.briefcase]
project_name = "OreoSB"
bundle = "com.oreosb"
version = "2.0.0"
url = "https://github.com/9ssault/oreosb"
license.file = "../LICENSE"
author = "9ssault"
author_email = "dev@local"

[tool.briefcase.app.oreosb]
formal_name = "OreoSB"
description = "OreoSB selfbot launcher"
long_description = "Desktop/mobile launcher for OreoSB"
sources = ["src/oreosb"]
requires = [
    "discord.py-self==2.0.1",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[tool.briefcase.app.oreosb.android]
requires = [
    "toga-android>=0.4.0",
]
base_theme = "Theme.MaterialComponents.DayNight.NoActionBar"

[tool.poetry]
name = "oreosb"
version = "2.0.0"
description = "OreoSB"
authors = ["9ssault"]

[build-system]
requires = ["briefcase"]
