name: Build OreoSB APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "main.py"
      - "cogs/**"
      - "evasion/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle bot assets
        run: |
          chmod +x android/bundle_assets.sh
          bash android/bundle_assets.sh

      - name: Install Briefcase
        run: |
          python -m pip install -U pip
          pip install briefcase toga toga-android

      - name: Briefcase create + build + package
        working-directory: android
        run: |
          briefcase create android -Q || briefcase create android
          briefcase build android
          briefcase package android -p apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Locate APK
        id: find
        run: |
          APK=$(find android -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find android -type f | head -100 || true
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          cp "$APK" OreoSB.apk
          ls -la OreoSB.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OreoSB-apk
          path: OreoSB.apk
          retention-days: 30
